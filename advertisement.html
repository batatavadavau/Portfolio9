  <title>Advertisement — Preksha Gautam</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .gallery-page { padding: 64px 48px 80px; }
    .page-header { margin-bottom: 56px; }

    .masonry {
      columns: 3;
      column-gap: 14px;
    }

    .masonry .card {
      break-inside: avoid;
      margin-bottom: 14px;
      border-radius: 4px;
      overflow: hidden;
    }

    .masonry .card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .masonry .card:hover img { transform: scale(1.03); }

    @media (max-width: 900px) {
      .masonry { columns: 2; }
      .gallery-page { padding: 40px 20px 60px; }
    }

    @media (max-width: 560px) {
      .masonry { columns: 1; }
    }
  </style>
</head>
